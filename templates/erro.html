{% extends "base.html" if current_user and current_user.is_authenticated else "auth/_base_acesso.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="erro-pagina">
  <div>
    <div class="erro-codigo num">{{ codigo }}</div>
    <h1 class="h3 fw-bold mt-3">{{ titulo }}</h1>
    <p class="texto-2 mb-4" style="max-width: 42ch; margin-inline: auto">{{ mensagem }}</p>
    <a href="{{ url_for('painel.inicio') }}" class="btn btn-primary">Voltar ao painel</a>
  </div>
</div>
{% endblock %}
