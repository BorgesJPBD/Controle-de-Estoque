services:

  # Container 1: Banco de dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: almoxarifado_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: almoxarifado
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      TZ: America/Campo_Grande
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Container 2: Aplicação Flask (servida pelo Gunicorn)
  app:
    image: joaopedroborges/almoxarifado:2.0
    container_name: almoxarifado_app
    build: .
    pull_policy: build          # sempre usa o código desta pasta, não a imagem antiga do Docker Hub
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: almoxarifado
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      # Chave que assina os cookies de login. Troque em produção (veja o .env.example).
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-antes-de-colocar-em-producao}
      TZ_APP: America/Campo_Grande
      TZ: America/Campo_Grande
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # Container 3: Adminer (interface web do banco)
  adminer:
    image: adminer:latest
    container_name: almoxarifado_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
