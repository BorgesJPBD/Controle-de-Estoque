version: "3.9"

services:

  # Container 1: Banco de dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: almoxarifado_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: almoxarifado
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Container 2: Aplicação Flask
  app:
    image: joaopedroborges/almoxarifado:latest
    container_name: almoxarifado_app
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: almoxarifado
      DB_USER: postgres
      DB_PASSWORD: postgres123
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # Container 3: Adminer (interface web do banco)
  adminer:
    image: adminer:latest
    container_name: almoxarifado_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: